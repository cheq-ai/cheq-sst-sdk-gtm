  - sha: 247740ba478e41ea6cb5d26bc39cd3edc32fcacc
    changeNotes: |-
      Updated the SST Web SDK to version 1.21.
      Breaking changes: pushed events now require a name key (events without one are reported and not sent), and ".set_customData" / ".set_customParam" were replaced by ".customData.set" / ".customParams.set".
      Improved request reliability: the SDK now guards against multiple initializations, handles non-serializable values without dropping the request, no longer mutates the data layer, and falls back to fetch keepalive when navigator.sendBeacon is unavailable.
      Added a "Virtual Browser Overrides" section, and added the Global Privacy Control signal to the virtual browser data.
      Expanded the JavaScript API with runtime setters (".dataLayer.set", ".virtualBrowser.set", and cookie / storage setters), a ".configured" flag, and support for function values in event data, evaluated at send time.
      The template now detects debug mode via the GTM container API instead of the "gtm_debug" URL parameter.
      Added a "High Entropy User-Agent Hints" section to collect the selected hints and add them to the virtual browser data.
      Added a "Dispatch Batched Events" option to send batched events only when the page is hidden or unloaded, instead of on a timer.
      The tag now only configures the SDK once per page, so firing it more than once no longer reports an error.
      Numeric Virtual Browser Overrides (screen and viewport sizes) are now sent as numbers, and integrations are explicitly off unless selected.
      Custom Parameters names must now be unique, matching how duplicate rows were already collapsed.
  - sha: 49591b74b5cba2552a9ecc19494f7696f2425587
    changeNotes: Fixed an issue where storage items (cookies, localStorage, sessionStorage) could be set to null and stop processing of the SST request.
